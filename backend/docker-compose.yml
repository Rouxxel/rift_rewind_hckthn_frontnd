services:
  backend:
    build: .
    container_name: rift_rewind_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file: .env
    ports:
      - "8000:8000"
    restart: always
    # Redis is optional — do not hard-depend so the API starts without it.
    # When using Compose Redis from the backend container, set REDIS_HOST=redis
    # and REDIS_ENABLED=true in .env. When running Python on the host against
    # this Redis service, use REDIS_HOST=localhost.

  redis:
    image: redis:7-alpine
    container_name: rift_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
