services:
  - type: web
    name: rift-rewind-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: RIOT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_ENABLED
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_DB
        sync: false
      - key: REDIS_SSL
        sync: false
