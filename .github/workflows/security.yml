name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4

  docker-scan:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7

      - name: Check for Dockerfiles
        id: check-docker
        run: |
          BACKEND_EXISTS=false
          FRONTEND_EXISTS=false
          if [ -f backend/Dockerfile ] || [ -f backend/DOCKERFILE ]; then BACKEND_EXISTS=true; fi
          if [ -f frontend_new/Dockerfile ] || [ -f frontend_new/DOCKERFILE ]; then FRONTEND_EXISTS=true; fi
          echo "backend=$BACKEND_EXISTS" >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND_EXISTS" >> $GITHUB_OUTPUT
          echo "Backend Dockerfile exists: $BACKEND_EXISTS"
          echo "Frontend Dockerfile exists: $FRONTEND_EXISTS"

      - name: Build backend Docker image
        if: steps.check-docker.outputs.backend == 'true'
        run: |
          if [ -f backend/Dockerfile ]; then
            docker build -f backend/Dockerfile -t rift-backend:ci backend/
          else
            docker build -f backend/DOCKERFILE -t rift-backend:ci backend/
          fi

      - name: Scan backend image (libraries only)
        if: steps.check-docker.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rift-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          vuln-type: library
          scanners: vuln

      - name: Build frontend Docker image
        if: steps.check-docker.outputs.frontend == 'true'
        run: |
          if [ -f frontend_new/Dockerfile ]; then
            docker build -f frontend_new/Dockerfile -t rift-frontend:ci frontend_new/
          else
            docker build -f frontend_new/DOCKERFILE -t rift-frontend:ci frontend_new/
          fi

      - name: Scan frontend image (libraries only)
        if: steps.check-docker.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rift-frontend:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          vuln-type: library
          scanners: vuln

      - name: No Dockerfiles found
        if: steps.check-docker.outputs.backend == 'false' && steps.check-docker.outputs.frontend == 'false'
        run: echo "No Dockerfiles found — skipping container scan."
