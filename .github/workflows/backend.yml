name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint ruff

      - name: Lint with Ruff (fast check)
        run: ruff check src/ main.py --select E,W,F,I --ignore E501
        continue-on-error: true

      - name: Check Python syntax (compile)
        run: python -m py_compile main.py

      - name: Compile all source files
        run: python -m compileall src/ -q

      - name: Verify startup imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          # Verify main module can be imported (catches missing deps)
          from dotenv import load_dotenv
          load_dotenv()
          import os
          os.environ.setdefault('RIOT_API_KEY', 'RGAPI-test-key-for-ci')
          os.environ.setdefault('GEMINI_API_KEY', 'test-key-for-ci')
          from main import app
          print('FastAPI app imports successfully')
          "

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Block committed env files
        run: |
          if [ -f .env ]; then echo "ERROR: .env file committed!" && exit 1; fi

      - name: Check for hardcoded API keys in source
        run: |
          ! grep -RInE '(RGAPI-[a-f0-9-]{36}|AIzaSy[a-zA-Z0-9_-]{33})' \
            --include='*.py' \
            --exclude-dir=__pycache__ \
            src/ main.py || \
            (echo "ERROR: Possible hardcoded API key found in source files." && exit 1)
